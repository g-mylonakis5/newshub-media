name = "newshub-roloi"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Οι ώρες είναι σε UTC — η Cloudflare δεν ξέρει από Ελλάδα.
#
# ΔΙΟΡΘΩΘΗΚΕ ΣΤΙΣ 13 ΝΟΕΜΒΡΙΟΥ 2026.
#
# Η παλιά υπόθεση ήταν «το newshub.gr δημοσιεύει 07:00 με 24:00 ώρα
# Ελλάδας», και το παράθυρο έκλεινε στις 22:59 UTC. Λάθος, και
# φάνηκε με δύο άρθρα: «Καιρός: Αφρικανική σκόνη» στη 01:08 και
# «Άσκηση ΜΙΝΩΑΣ-26» στις 00:50, ώρα Ελλάδας. Έμειναν έξω από το
# site για ώρες.
#
# Το δίχτυ από κάτω — το cron του GitHub, κάθε 30 λεπτά — δεν πιάνει:
# στην πράξη τρέχει κάθε δύο ώρες, γιατί το GitHub αγνοεί τα
# προγραμματισμένα τρεξίματα όταν έχει φόρτο. Μετρημένο την ίδια
# νύχτα: 20:23 και μετά 22:26.
#
# Νέο παράθυρο 00:00-01:59 και 04:00-23:59 UTC. Σε ώρα Ελλάδας αυτό
# καλύπτει 06:00 έως 03:59 τον χειμώνα — δηλαδή από πριν το πρώτο
# άρθρο μέχρι μετά το τελευταίο. Νεκρό μένει μόνο το 04:00-06:00,
# που κανείς δεν δημοσιεύει.
#
# Κάθε 5 λεπτά, όχι κάθε 1: η καθυστέρηση δεν είναι η συχνότητα του
# ρολογιού, είναι το χτίσιμο του site που θέλει ~4 λεπτά. Ρολόι πιο
# πυκνό από το χτίσιμο δεν κερδίζει δευτερόλεπτο — απλώς τρώει
# τρεξίματα. Όταν μπει η ζωντανή ροή και πάψουμε να χτίζουμε για κάθε
# είδηση, τότε έχει νόημα να πυκνώσει.
#
# Κάθε λεπτό, και δεν κοστίζει: ο Worker κοιτάζει πρώτα το sitemap και
# ξεκινά τρέξιμο στο GitHub μόνο αν βγήκε όντως κάτι (δες το PATOMA_LEPTA
# στο src/index.js). Οι 1.320 κλήσεις τη μέρα είναι από τις 100.000 που
# δίνει το δωρεάν πλάνο της Cloudflare — αυτές είναι φθηνές. Ακριβά
# είναι τα λεπτά του GitHub, και αυτά τα φυλάει το πάτωμα: οι δύο ώρες
# που προστέθηκαν δεν φέρνουν ούτε ένα τρέξιμο παραπάνω αν δεν βγει
# όντως είδηση.
[triggers]
crons = ["* 0-1,4-23 * * *"]

[vars]
GITHUB_REPO = "g-mylonakis5/newshub-media"
GITHUB_BRANCH = "main"

# Το σημειωματάριο: τι είδαμε τελευταία φορά στο sitemap, και πότε
# πατήσαμε. Χωρίς αυτό ο Worker ξυπνά χωρίς μνήμη κάθε λεπτό και δεν
# μπορεί να ξεχωρίσει το καινούριο από το χθεσινό.
[[kv_namespaces]]
binding = "ROI"
id = "828a6c3fe1944967b6022e6f5a7acdbe"

# Το GITHUB_TOKEN ΔΕΝ μπαίνει εδώ — αυτό το αρχείο είναι στο git.
# Μπαίνει μία φορά ως μυστικό, από το τερματικό:
#
#   cd roloi
#   npx wrangler secret put GITHUB_TOKEN
#
# Θέλει δικαίωμα «Actions: Read and write» στο repo. Είναι το ίδιο
# token που έχει ήδη το Cloudflare Pages για το διαχειριστικό.
