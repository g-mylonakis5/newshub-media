
name: Έλεγχος εικόνων

on:
  push:
    paths:
      - 'public/styles.css'
      - 'public/player.js'
      - 'build.js'
      - 'check-images.js'
      - '.github/workflows/eikones.yml'
  pull_request:
    paths:
      - 'public/styles.css'
      - 'public/player.js'
      - 'build.js'
      - 'check-images.js'
  workflow_dispatch:   # and by hand, from the Actions tab

concurrency:
  group: eikones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eikones:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium only. --with-deps pulls the libraries the ubuntu runner
      # lacks; without it the browser does not open.
      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Χτίσιμο
        run: |
          node fetch-weather.js || echo 'Χωρίς καιρό — δεν πειράζει εδώ.'
          node build.js

      - name: Μετράμε κάθε εικόνα
        run: node check-images.js
