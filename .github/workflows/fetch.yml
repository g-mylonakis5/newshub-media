# Φρέσκο υλικό, χωρίς να το ζητήσει κανείς.
#
# Γιατί τρέχει εδώ και όχι στο Cloudflare: το data/news.json είναι
# ΣΥΣΣΩΡΕΥΤΙΚΟ — κρατά ειδήσεις που το sitemap του newshub.gr δεν δίνει
# πια. Ο δίσκος του Cloudflare σβήνεται μετά από κάθε build, άρα εκεί το
# ιστορικό θα ξεκινούσε από το μηδέν κάθε φορά. Το ίδιο και οι 20MB
# απομαγνητοφωνήσεις, που θα ξανακατέβαιναν όλες.
#
# Εδώ τα κατεβάζουμε, τα κάνουμε commit στο git, και το push ξυπνά μόνο
# του το Cloudflare. Ο καιρός ΔΕΝ μπαίνει εδώ: είναι εφήμερος εξ ορισμού
# και τον τραβάει το ίδιο το build.

name: Φρέσκο υλικό

# Πόσο συχνά, και γιατί τόσο.
#
# Το repo είναι ιδιωτικό: το GitHub δίνει 2.000 λεπτά τον μήνα και
# χρεώνει ΑΝΑ ΤΡΕΞΙΜΟ, στρογγυλοποιώντας προς τα πάνω σε ολόκληρο λεπτό.
# Οπότε δέκα ελαφριά τρεξίματα κοστίζουν δέκα λεπτά, όχι δέκα
# δευτερόλεπτα — και το ξεχωριστό ρολόι για κάθε πηγή βγαίνει ακριβό.
#
# Γι' αυτό τα φθηνά μπαίνουν ΜΑΖΙ σε ένα πυκνό τρέξιμο:
#
#   κάθε 30'      ειδήσεις + επεισόδια      48/μέρα  ~1.440 λεπτά/μήνα
#   3 φορές/μέρα  βίντεο + απομαγνητοφωνήσεις          ~90 λεπτά/μήνα
#                                            σύνολο ~1.530 από 2.000
#
# Τα επεισόδια έφευγαν παλιά μαζί με τα βαριά, 3 φορές τη μέρα: ένα νέο
# επεισόδιο μπορούσε να λείπει έξι ώρες από το διαχειριστικό, και ο
# δημοσιογράφος δεν μπορούσε να γράψει άρθρο γι' αυτό. Είναι RSS, ένα
# αίτημα — δεν υπήρχε λόγος να περιμένει.
on:
  schedule:
    - cron: '*/30 * * * *'      # ειδήσεις + επεισόδια — κάθε μισή ώρα
    - cron: '40 4,10,16 * * *'  # βίντεο, απομαγνητοφωνήσεις — 3 φορές τη μέρα
  workflow_dispatch:            # και με το χέρι, από την καρτέλα Actions

permissions:
  contents: write
  issues: write     # για την ειδοποίηση όταν παγώσει η ροή

# Δύο τρεξίματα μαζί θα χτυπούσαν το ένα το push του άλλου.
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Τα φθηνά, σε κάθε τρέξιμο.
      - name: Ειδήσεις
        run: node fetch-news.js

      - name: Επεισόδια
        run: node fetch-episodes.js

      # Τα βαριά τα παραλείπουμε στο μισάωρο: το YouTube API έχει
      # ΗΜΕΡΗΣΙΟ όριο κλήσεων — αν το φάμε, σταματούν όλα μέχρι το
      # επόμενο εικοσιτετράωρο — και οι απομαγνητοφωνήσεις είναι 20 MB.
      #
      # Με το χέρι (workflow_dispatch) τρέχουν κι αυτά: τότε το ζητάει
      # άνθρωπος που ξέρει γιατί.
      - name: Βίντεο και απομαγνητοφωνήσεις
        if: github.event.schedule != '*/30 * * * *'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node fetch-videos.js
          node fetch-transcripts.js

      # Commit ΜΟΝΟ αν άλλαξε κάτι — αλλιώς το Cloudflare θα ξανάχτιζε
      # 4.600 σελίδες για το τίποτα, κάθε ώρα.
      - name: Commit και push
        run: |
          git config user.name  'newshub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'Καμία αλλαγή — δεν χτίζουμε.'
            exit 0
          fi
          git commit -m "Φρέσκο υλικό — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # Η δικλείδα. Κοιτάζει ΑΠΟΤΕΛΕΣΜΑ, όχι σφάλματα: πόση ώρα έχει να
      # μπει καινούρια είδηση. Έτσι πιάνει με έναν έλεγχο όλα όσα
      # σταματούν τη ροή σιωπηλά — σπασμένο ή άδειο sitemap, ληγμένο
      # token, ανασχεδιασμό του newshub.gr.
      #
      # continue-on-error: το πάγωμα δεν είναι αποτυχία της εργασίας. Η
      # λήψη έγινε σωστά· το πρόβλημα είναι ότι δεν υπήρχε τίποτα να
      # ληφθεί, και θέλουμε να το πούμε με δικά μας λόγια.
      - name: Δικλείδα — μπαίνουν όντως ειδήσεις;
        id: fresh
        continue-on-error: true
        run: node check-fresh.js

      # Ένα issue, όχι δέκα: το GitHub στέλνει email μόλις ανοίξει, και
      # με έλεγχο κάθε μισή ώρα θα γέμιζε το inbox μέχρι να το δει
      # κάποιος. Αν υπάρχει ήδη ανοιχτό, προσθέτουμε σχόλιο ΜΟΝΟ την
      # πρώτη φορά κάθε μέρα, ώστε να φαίνεται ότι συνεχίζεται.
      - name: Ειδοποίηση αν πάγωσε η ροή
        if: steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Πάγωσε η ροή ειδήσεων'

          # Την πρώτη φορά η ετικέτα δεν υπάρχει, και χωρίς αυτήν το
          # «gh issue list --label» σφάλλει αντί να γυρίσει άδειο.
          gh label create pagoma --repo "$REPO" --color B60205 \
            --description 'Η ροή σταμάτησε να ανανεώνεται' 2>/dev/null || true

          OPEN=$(gh issue list --repo "$REPO" --state open --label pagoma \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -z "$OPEN" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label pagoma --body "$(cat <<BODY
          Ο έλεγχος βρήκε ότι δεν μπαίνουν νέες ειδήσεις.

          \`\`\`
          $(node check-fresh.js 2>&1 || true)
          \`\`\`

          **Γιατί επείγει:** το sitemap του newshub.gr είναι κυλιόμενο
          παράθυρο τριών ημερών. Ό,τι δεν σωθεί μέσα σε αυτές τις τρεις
          μέρες χάνεται οριστικά.

          **Τι να ελέγξεις, με αυτή τη σειρά:**

          1. Ανοίγει το <https://www.newshub.gr/sitemap_google_news.php>; Έχει μέσα άρθρα;
          2. Το τρέξιμο που το εντόπισε: $RUN
          3. Μήπως έληξε το GitHub token ή το YOUTUBE_API_KEY;

          Κλείσε αυτό το issue όταν ξαναμπούν ειδήσεις — θα ξανανοίξει μόνο του αν χρειαστεί.
          BODY
          )"
          else
            SINCE=$(date -u '+%Y-%m-%d')
            SEEN=$(gh issue view "$OPEN" --repo "$REPO" --json comments \
                     --jq "[.comments[] | select(.body | startswith(\"$SINCE\"))] | length")
            if [ "$SEEN" = '0' ]; then
              gh issue comment "$OPEN" --repo "$REPO" \
                --body "$SINCE — συνεχίζεται. Τελευταίο τρέξιμο: $RUN"
            fi
          fi
