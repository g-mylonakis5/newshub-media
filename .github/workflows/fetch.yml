# Φρέσκο υλικό, χωρίς να το ζητήσει κανείς.
#
# Γιατί τρέχει εδώ και όχι στο Cloudflare: το data/news.json είναι
# ΣΥΣΣΩΡΕΥΤΙΚΟ — κρατά ειδήσεις που το sitemap του newshub.gr δεν δίνει
# πια. Ο δίσκος του Cloudflare σβήνεται μετά από κάθε build, άρα εκεί το
# ιστορικό θα ξεκινούσε από το μηδέν κάθε φορά. Το ίδιο και οι 20MB
# απομαγνητοφωνήσεις, που θα ξανακατέβαιναν όλες.
#
# Εδώ τα κατεβάζουμε, τα κάνουμε commit στο git, και το push ξυπνά μόνο
# του το Cloudflare. Ο καιρός ΔΕΝ μπαίνει εδώ: είναι εφήμερος εξ ορισμού
# και τον τραβάει το ίδιο το build.

name: Φρέσκο υλικό

# Πόσο συχνά, και γιατί τόσο.
#
# Το repo είναι ιδιωτικό: το GitHub δίνει 2.000 λεπτά τον μήνα και
# χρεώνει ΑΝΑ ΤΡΕΞΙΜΟ, στρογγυλοποιώντας προς τα πάνω σε ολόκληρο λεπτό.
# Οπότε δέκα ελαφριά τρεξίματα κοστίζουν δέκα λεπτά, όχι δέκα
# δευτερόλεπτα — και το ξεχωριστό ρολόι για κάθε πηγή βγαίνει ακριβό.
#
# Γι' αυτό τα φθηνά μπαίνουν ΜΑΖΙ σε ένα πυκνό τρέξιμο:
#
#   κάθε 30'      ειδήσεις + επεισόδια      48/μέρα  ~1.440 λεπτά/μήνα
#   3 φορές/μέρα  βίντεο + απομαγνητοφωνήσεις          ~90 λεπτά/μήνα
#                                            σύνολο ~1.530 από 2.000
#
# Τα επεισόδια έφευγαν παλιά μαζί με τα βαριά, 3 φορές τη μέρα: ένα νέο
# επεισόδιο μπορούσε να λείπει έξι ώρες από το διαχειριστικό, και ο
# δημοσιογράφος δεν μπορούσε να γράψει άρθρο γι' αυτό. Είναι RSS, ένα
# αίτημα — δεν υπήρχε λόγος να περιμένει.
on:
  schedule:
    - cron: '*/30 * * * *'      # ειδήσεις + επεισόδια — κάθε μισή ώρα
    - cron: '40 4,10,16 * * *'  # βίντεο, απομαγνητοφωνήσεις — 3 φορές τη μέρα
  workflow_dispatch:            # και με το χέρι, από την καρτέλα Actions
    inputs:
      # Άσκηση πυρκαγιάς. Η δικλείδα θα χτυπήσει πρώτη φορά σε έξι
      # μήνες, όταν κανείς δεν θα θυμάται πώς στήθηκε — και ένας
      # συναγερμός που δεν τον άκουσες ποτέ είναι υπόθεση, όχι δικλείδα.
      dokimi:
        description: 'Δοκιμή ειδοποίησης — χτυπάει επίτηδες ο συναγερμός'
        type: boolean
        default: false

      # Τα βαριά, κατ' εξαίρεση.
      #
      # Από εδώ και πέρα το workflow δεν το ξεκινά μόνο άνθρωπος: το
      # καλεί και το ρολόι της Cloudflare, κάθε λίγα λεπτά, επειδή το
      # χρονοδιάγραμμα του GitHub πετάει το 87% των τρεξιμάτων.
      #
      # Αν τα βαριά έτρεχαν σε κάθε τέτοια κλήση, το ημερήσιο όριο του
      # YouTube θα τελείωνε μέσα σε μία ώρα. Οπότε κλειστά από
      # προεπιλογή — τα ανοίγει μόνο όποιος τα ζητήσει ρητά.
      varia:
        description: 'Μαζί και βίντεο + απομαγνητοφωνήσεις (τρώει όριο YouTube)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # για την ειδοποίηση όταν παγώσει η ροή

# Δύο τρεξίματα μαζί θα χτυπούσαν το ένα το push του άλλου.
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Τα φθηνά, σε κάθε τρέξιμο.
      #
      # ΚΑΘΕ ΠΗΓΗ ΞΕΧΩΡΙΣΤΑ. Από προεπιλογή το GitHub σταματά το job στο
      # πρώτο βήμα που πέφτει — και στις 6 Νοεμβρίου 2026 μια αργοπορία
      # του newshub.gr παρέσυρε μαζί της τα επεισόδια του Buzzsprout,
      # που δεν είχαν καμία σχέση, και το push που θα έσωζε ό,τι είχε
      # ήδη κατέβει. Οι πηγές μας είναι ανεξάρτητες μεταξύ τους· όταν
      # πέφτει η μία, οι άλλες πρέπει να συνεχίζουν.
      #
      # Το continue-on-error δεν σημαίνει «δεν μας νοιάζει»: το τρέξιμο
      # κοκκινίζει στο τελευταίο βήμα, αφού πρώτα σωθούν τα υπόλοιπα.
      - name: Ειδήσεις
        id: eidiseis
        continue-on-error: true
        run: node fetch-news.js

      - name: Επεισόδια
        id: epeisodia
        if: always()
        continue-on-error: true
        run: node fetch-episodes.js

      # Τα βαριά τα παραλείπουμε στο μισάωρο: το YouTube API έχει
      # ΗΜΕΡΗΣΙΟ όριο κλήσεων — αν το φάμε, σταματούν όλα μέχρι το
      # επόμενο εικοσιτετράωρο — και οι απομαγνητοφωνήσεις είναι 20 MB.
      #
      # Η συνθήκη λέει ΠΟΤΕ ΝΑΙ, όχι πότε όχι. Παλιά έλεγε «σε ό,τι δεν
      # είναι το μισάωρο» — και κάθε νέος τρόπος κλήσης έμπαινε μέσα
      # από μόνος του. Μόλις το ρολόι της Cloudflare άρχισε να καλεί
      # workflow_dispatch κάθε λίγα λεπτά, αυτό θα σήμαινε δεκάδες
      # κλήσεις στο YouTube τη μέρα αντί για τρεις.
      #
      # Τώρα τρέχουν σε δύο περιπτώσεις, και σε καμία άλλη: στο δικό
      # τους ρολόι, ή όταν τα ζητήσει ρητά άνθρωπος.
      - name: Βίντεο και απομαγνητοφωνήσεις
        id: varia
        if: always() && (github.event.schedule == '40 4,10,16 * * *' || inputs.varia == true)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node fetch-videos.js
          node fetch-transcripts.js

      # Commit ΜΟΝΟ αν άλλαξε κάτι — αλλιώς το Cloudflare θα ξανάχτιζε
      # 4.600 σελίδες για το τίποτα, κάθε ώρα.
      #
      # Τρέχει ΠΑΝΤΑ: αν κατέβηκαν τα επεισόδια αλλά όχι οι ειδήσεις,
      # τα επεισόδια πρέπει να σωθούν. Μισή λήψη είναι καλύτερη από
      # καμία, ειδικά όταν το sitemap τους κρατάει μόνο τρεις μέρες.
      - name: Commit και push
        if: always()
        run: |
          git config user.name  'newshub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'Καμία αλλαγή — δεν χτίζουμε.'
            exit 0
          fi
          git commit -m "Φρέσκο υλικό — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # Η δικλείδα. Κοιτάζει ΑΠΟΤΕΛΕΣΜΑ, όχι σφάλματα: πόση ώρα έχει να
      # μπει καινούρια είδηση. Έτσι πιάνει με έναν έλεγχο όλα όσα
      # σταματούν τη ροή σιωπηλά — σπασμένο ή άδειο sitemap, ληγμένο
      # token, ανασχεδιασμό του newshub.gr.
      #
      # continue-on-error: το πάγωμα δεν είναι αποτυχία της εργασίας. Η
      # λήψη έγινε σωστά· το πρόβλημα είναι ότι δεν υπήρχε τίποτα να
      # ληφθεί, και θέλουμε να το πούμε με δικά μας λόγια.
      #
      # if: always() — ΤΟ ΚΥΡΙΟΤΕΡΟ. Χωρίς αυτό η δικλείδα σιωπούσε
      # ακριβώς όταν τη χρειαζόσουν: στις 6 Νοεμβρίου 2026 έπεσε το
      # πρώτο βήμα, όλα τα επόμενα έγιναν skipped μαζί της, και το κενό
      # επτά ωρών μέσα στη μέρα δεν το ανέφερε κανείς. Ένας συναγερμός
      # που δεν χτυπάει στη βλάβη δεν είναι συναγερμός.
      - name: Δικλείδα — μπαίνουν όντως ειδήσεις;
        id: fresh
        if: always()
        continue-on-error: true
        run: |
          if [ '${{ inputs.dokimi }}' = 'true' ]; then
            echo 'ΔΟΚΙΜΗ: ο συναγερμός χτυπάει επίτηδες, η ροή είναι μια χαρά.'
            exit 1
          fi
          node check-fresh.js

      # Ένα issue, όχι δέκα: το GitHub στέλνει email μόλις ανοίξει, και
      # με έλεγχο κάθε μισή ώρα θα γέμιζε το inbox μέχρι να το δει
      # κάποιος. Αν υπάρχει ήδη ανοιχτό, προσθέτουμε σχόλιο ΜΟΝΟ την
      # πρώτη φορά κάθε μέρα, ώστε να φαίνεται ότι συνεχίζεται.
      - name: Ειδοποίηση αν πάγωσε η ροή
        if: always() && steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Πάγωσε η ροή ειδήσεων'
          DOKIMI=''

          # Στη δοκιμή το μήνυμα πρέπει να λέει ΑΜΕΣΩΣ ότι είναι δοκιμή:
          # αλλιώς κάποιος θα ψάχνει μισή ώρα βλάβη που δεν υπάρχει.
          if [ '${{ inputs.dokimi }}' = 'true' ]; then
            TITLE='ΔΟΚΙΜΗ — Πάγωσε η ροή ειδήσεων'
            DOKIMI='> **ΔΟΚΙΜΗ.** Δεν συμβαίνει τίποτα, ο συναγερμός χτύπησε'
            DOKIMI="$DOKIMI επίτηδες για να ελεγχθεί. Κλείσε το issue."
          fi

          # Την πρώτη φορά η ετικέτα δεν υπάρχει, και χωρίς αυτήν το
          # «gh issue list --label» σφάλλει αντί να γυρίσει άδειο.
          gh label create pagoma --repo "$REPO" --color B60205 \
            --description 'Η ροή σταμάτησε να ανανεώνεται' 2>/dev/null || true

          OPEN=$(gh issue list --repo "$REPO" --state open --label pagoma \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -z "$OPEN" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label pagoma --body "$(cat <<BODY
          $DOKIMI
          Ο έλεγχος βρήκε ότι δεν μπαίνουν νέες ειδήσεις.

          \`\`\`
          $(node check-fresh.js 2>&1 || true)
          \`\`\`

          **Γιατί επείγει:** το sitemap του newshub.gr είναι κυλιόμενο
          παράθυρο τριών ημερών. Ό,τι δεν σωθεί μέσα σε αυτές τις τρεις
          μέρες χάνεται οριστικά.

          **Τι να ελέγξεις, με αυτή τη σειρά:**

          1. Ανοίγει το <https://www.newshub.gr/sitemap_google_news.php>; Έχει μέσα άρθρα;
          2. Το τρέξιμο που το εντόπισε: $RUN
          3. Μήπως έληξε το GitHub token ή το YOUTUBE_API_KEY;

          Κλείσε αυτό το issue όταν ξαναμπούν ειδήσεις — θα ξανανοίξει μόνο του αν χρειαστεί.
          BODY
          )"
          else
            SINCE=$(date -u '+%Y-%m-%d')
            SEEN=$(gh issue view "$OPEN" --repo "$REPO" --json comments \
                     --jq "[.comments[] | select(.body | startswith(\"$SINCE\"))] | length")
            if [ "$SEEN" = '0' ]; then
              gh issue comment "$OPEN" --repo "$REPO" \
                --body "$SINCE — συνεχίζεται. Τελευταίο τρέξιμο: $RUN"
            fi
          fi

      # Ο απολογισμός.
      #
      # Τα continue-on-error από πάνω αφήνουν το τρέξιμο να τελειώσει
      # ώστε να σωθεί ό,τι κατέβηκε. Αν σταματούσαμε εδώ, το τρέξιμο θα
      # έβγαινε ΠΡΑΣΙΝΟ ενώ μια πηγή είναι νεκρή — και ένα πράσινο που
      # λέει ψέματα είναι χειρότερο από καθόλου έλεγχο.
      #
      # Οπότε το κοκκινίζουμε εδώ, στο τέλος, γράφοντας ΠΟΙΑ πηγή
      # έπεσε. Έτσι το email του GitHub λέει κατευθείαν πού να κοιτάξεις.
      - name: Ποια πηγή έπεσε
        if: always()
        run: |
          # Με if, όχι με «[ ] && ...»: το bash εδώ τρέχει με -e, και μια
          # ψευδής συνθήκη σε τέτοια γραμμή μπορεί να ρίξει το βήμα για
          # λάθος λόγο.
          BAD=''
          if [ '${{ steps.eidiseis.outcome }}' = 'failure' ]; then BAD="$BAD ειδήσεις"; fi
          if [ '${{ steps.epeisodia.outcome }}' = 'failure' ]; then BAD="$BAD επεισόδια"; fi
          if [ '${{ steps.varia.outcome }}' = 'failure' ]; then BAD="$BAD βίντεο/απομαγνητοφωνήσεις"; fi

          if [ -n "$BAD" ]; then
            echo "Δεν κατέβηκαν:$BAD" >&2
            echo "Ό,τι άλλο κατέβηκε σώθηκε κανονικά — δες τα βήματα πιο πάνω." >&2
            exit 1
          fi
          echo 'Όλες οι πηγές κατέβηκαν.'
