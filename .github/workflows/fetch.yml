
name: Φρέσκο υλικό

on:
  schedule:
    - cron: '*/30 * * * *'      # ειδήσεις + επεισόδια — κάθε μισή ώρα
    - cron: '40 4,10,16 * * *'  # βίντεο, απομαγνητοφωνήσεις — 3 φορές τη μέρα
  workflow_dispatch:            # και με το χέρι, από την καρτέλα Actions
    inputs:
      # Άσκηση πυρκαγιάς. Η δικλείδα θα χτυπήσει πρώτη φορά σε έξι
      # μήνες, όταν κανείς δεν θα θυμάται πώς στήθηκε — και ένας
      # συναγερμός που δεν τον άκουσες ποτέ είναι υπόθεση, όχι δικλείδα.
      dokimi:
        description: 'Δοκιμή ειδοποίησης — χτυπάει επίτηδες ο συναγερμός'
        type: boolean
        default: false

      varia:
        description: 'Μαζί και βίντεο + απομαγνητοφωνήσεις (τρώει όριο YouTube)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # για την ειδοποίηση όταν παγώσει η ροή

# Δύο τρεξίματα μαζί θα χτυπούσαν το ένα το push του άλλου.
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Το σημάδι «μπήκε κάτι καινούριο», για το ανέβασμα που ακολουθεί.
    outputs:
      allaxe: ${{ steps.push.outputs.allaxe }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ειδήσεις
        id: eidiseis
        continue-on-error: true
        run: node fetch-news.js

      - name: Ζωντανή ροή στο KV
        id: roi
        if: always()
        continue-on-error: true
        env:
          ROLOI_URL: https://newshub-roloi.g-mylonakis5.workers.dev
          ROLOI_KLEIDI: ${{ secrets.ROLOI_KLEIDI }}
        run: node roi-se-kv.js

      - name: Επεισόδια
        id: epeisodia
        if: always()
        continue-on-error: true
        run: node fetch-episodes.js

      - name: Βίντεο και απομαγνητοφωνήσεις
        id: varia
        if: >-
          always() && (github.event.schedule == '40 4,10,16 * * *'
            || inputs.varia == true || inputs.varia == 'true')
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node fetch-videos.js
          node fetch-transcripts.js

      - name: Commit και push
        id: push
        if: always()
        run: |
          git config user.name  'newshub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'Καμία αλλαγή — δεν χτίζουμε.'
            exit 0
          fi

          # Το σημάδι για το ανέβασμα. Χωρίς αλλαγή δεδομένων δεν
          # υπάρχει τίποτα καινούριο να ανέβει, και το τρέξιμο σταματά
          # εδώ — δες το job «anevasma» στο τέλος του αρχείου.
          echo 'allaxe=1' >> "$GITHUB_OUTPUT"
          git commit -m "Φρέσκο υλικό — $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Το push απορρίφθηκε ($i από 3) — τραβάω και ξαναδοκιμάζω."

            if ! git pull --rebase --autostash -X theirs origin main; then
              echo 'Το rebase κόλλησε σε σύγκρουση — το ακυρώνω.'
              git rebase --abort || true

              git pull --no-rebase --autostash -X theirs origin main || true
            fi
          done
          git push

      - name: Δικλείδα — μπαίνουν όντως ειδήσεις;
        id: fresh
        if: always()
        continue-on-error: true
        run: |
          if [ '${{ inputs.dokimi }}' = 'true' ]; then
            echo 'ΔΟΚΙΜΗ: ο συναγερμός χτυπάει επίτηδες, η ροή είναι μια χαρά.'
            exit 1
          fi
          node check-fresh.js

      - name: Ειδοποίηση αν πάγωσε η ροή
        if: always() && steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Πάγωσε η ροή ειδήσεων'
          DOKIMI=''

          ETIKETA='pagoma'
          PERIGRAFI='Η ροή σταμάτησε να ανανεώνεται'

          # Στη δοκιμή το μήνυμα πρέπει να λέει ΑΜΕΣΩΣ ότι είναι δοκιμή:
          # αλλιώς κάποιος θα ψάχνει μισή ώρα βλάβη που δεν υπάρχει.
          if [ '${{ inputs.dokimi }}' = 'true' ]; then
            TITLE='ΔΟΚΙΜΗ — Πάγωσε η ροή ειδήσεων'
            DOKIMI='> **ΔΟΚΙΜΗ.** Δεν συμβαίνει τίποτα, ο συναγερμός χτύπησε'
            DOKIMI="$DOKIMI επίτηδες για να ελεγχθεί. Κλείσε το issue."
            ETIKETA='pagoma-dokimi'
            PERIGRAFI='Δοκιμή του συναγερμού — δεν είναι αληθινή βλάβη'
          fi

          # Την πρώτη φορά η ετικέτα δεν υπάρχει, και χωρίς αυτήν το
          # «gh issue list --label» σφάλλει αντί να γυρίσει άδειο.
          gh label create "$ETIKETA" --repo "$REPO" --color B60205 \
            --description "$PERIGRAFI" 2>/dev/null || true

          OPEN=$(gh issue list --repo "$REPO" --state open --label "$ETIKETA" \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -z "$OPEN" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label "$ETIKETA" --body "$(cat <<BODY
          $DOKIMI
          Ο έλεγχος βρήκε ότι δεν μπαίνουν νέες ειδήσεις.

          \`\`\`
          $(node check-fresh.js 2>&1 || true)
          \`\`\`

          **Γιατί επείγει:** το sitemap του newshub.gr είναι κυλιόμενο
          παράθυρο τριών ημερών. Ό,τι δεν σωθεί μέσα σε αυτές τις τρεις
          μέρες χάνεται οριστικά.

          **Τι να ελέγξεις, με αυτή τη σειρά:**

          1. Ανοίγει το <https://www.newshub.gr/sitemap_google_news.xml>; Έχει μέσα άρθρα;
             Αν κάνει ανακατεύθυνση στην αρχική τους, άλλαξαν πάλι τη διεύθυνση —
             δες τι λέει το <https://www.newshub.gr/robots.txt>.
          2. Το τρέξιμο που το εντόπισε: $RUN
          3. Μήπως έληξε το GitHub token ή το YOUTUBE_API_KEY;

          Κλείσε αυτό το issue όταν ξαναμπούν ειδήσεις — θα ξανανοίξει μόνο του αν χρειαστεί.
          BODY
          )"
          else
            SINCE=$(date -u '+%Y-%m-%d')
            SEEN=$(gh issue view "$OPEN" --repo "$REPO" --json comments \
                     --jq "[.comments[] | select(.body | startswith(\"$SINCE\"))] | length")
            if [ "$SEEN" = '0' ]; then
              gh issue comment "$OPEN" --repo "$REPO" \
                --body "$SINCE — συνεχίζεται. Τελευταίο τρέξιμο: $RUN"
            fi
          fi

      - name: Ποια πηγή έπεσε
        if: always()
        run: |
          # Με if, όχι με «[ ] && ...»: το bash εδώ τρέχει με -e, και μια
          # ψευδής συνθήκη σε τέτοια γραμμή μπορεί να ρίξει το βήμα για
          # λάθος λόγο.
          BAD=''
          if [ '${{ steps.eidiseis.outcome }}' = 'failure' ]; then BAD="$BAD ειδήσεις"; fi
          if [ '${{ steps.epeisodia.outcome }}' = 'failure' ]; then BAD="$BAD επεισόδια"; fi
          if [ '${{ steps.varia.outcome }}' = 'failure' ]; then BAD="$BAD βίντεο/απομαγνητοφωνήσεις"; fi

          if [ '${{ steps.roi.outcome }}' = 'failure' ]; then
            echo 'Η ζωντανή ροή δεν γράφτηκε στο KV. Το site δείχνει τη ροή'
            echo 'του τελευταίου χτισίματος — ανώδυνο, δεν κοκκινίζει.'
          fi

          if [ -n "$BAD" ]; then
            echo "Δεν κατέβηκαν:$BAD" >&2
            echo "Ό,τι άλλο κατέβηκε σώθηκε κανονικά — δες τα βήματα πιο πάνω." >&2
            exit 1
          fi
          echo 'Όλες οι πηγές κατέβηκαν.'

  anevasma:
    needs: fetch
    if: needs.fetch.outputs.allaxe == '1'
    uses: ./.github/workflows/anevasma.yml
    secrets: inherit
