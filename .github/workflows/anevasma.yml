# Ανέβασμα — χτίζει το site εδώ και το στέλνει έτοιμο στο Cloudflare.
#
# ΓΙΑΤΙ ΑΛΛΑΞΕ
#
# Μέχρι τώρα το Cloudflare τραβούσε το repo και έχτιζε μόνο του σε κάθε
# push. Δύο προβλήματα:
#
# 1. Το δωρεάν πλάνο δίνει 500 χτισίματα τον μήνα. Κάναμε ~160 την
#    ημέρα — δηλαδή ~4.800 τον μήνα. Ούτε το πληρωμένο Pro (5.000) θα
#    έφτανε με άνεση.
# 2. Το Cloudflare ξεκινά κάθε φορά από ΑΔΕΙΟ φάκελο. Όλη η εξυπνάδα
#    του build.js — «γράφω μόνο ό,τι άλλαξε» — πετιόταν: ξανάγραφε και
#    τις 1.083 σελίδες επεισοδίων κάθε φορά, 2-4 λεπτά.
#
# Εδώ κρατάμε το προηγούμενο public/ στη μνήμη του GitHub, οπότε το
# χτίσιμο είναι σταδιακό και τελειώνει σε δευτερόλεπτα. Το ανέβασμα
# γίνεται με «direct upload», που ΔΕΝ μετράει στα 500.
#
# Τα λεπτά του GitHub είναι δωρεάν και απεριόριστα επειδή το repo είναι
# δημόσιο. Άρα: πιο γρήγορα στον αέρα, και χωρίς όριο.
#
# ΔΥΟ ΠΟΡΤΕΣ ΕΙΣΟΔΟΥ
#
#   push          — ο δημοσιογράφος πάτησε «Δημοσίευση» στο διαχειριστικό
#   workflow_call — το τέλος του «Φρέσκο υλικό» (fetch.yml)
#
# Το fetch.yml σπρώχνει με το GITHUB_TOKEN, και τέτοιο push ΔΕΝ ξεκινά
# άλλο workflow — γι' αυτό μας καλεί ρητά αντί να βασιστεί στο push.

name: Ανέβασμα

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Όταν στοιβάζονται πολλά, μόνο το τελευταίο μετράει: ανεβάζει ολόκληρο
# τον φάκελο, οπότε το προτελευταίο δεν λείπει από πουθενά.
concurrency:
  group: anevasma
  cancel-in-progress: true

jobs:
  anevasma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ΧΩΡΙΣ npm ci. Το χτίσιμο δεν έχει καμία εξάρτηση — το package.json
      # έχει μόνο το playwright, και αυτό μόνο για τον έλεγχο εικόνων.
      # Το Pagefind το φέρνει το npx όταν χρειαστεί.

      # Το προηγούμενο public/ από τη μνήμη.
      #
      # Το κλειδί έχει μέσα την ΩΡΑ, όχι τον αριθμό του τρεξίματος: έτσι
      # το GitHub σώζει καινούριο αντίγραφο μία φορά την ώρα αντί για 160
      # τη μέρα, και τα υπόλοιπα τρεξίματα απλώς διαβάζουν. Το restore-keys
      # πιάνει το πιο πρόσφατο που υπάρχει, όποιας ώρας κι αν είναι.
      #
      # Αν λείπει εντελώς — πρώτο τρέξιμο, ή το έσβησε το GitHub — δεν
      # σπάει τίποτα: το build.js τα γράφει όλα από την αρχή, απλώς αργεί
      # όσο αργούσε και το Cloudflare.
      - name: Η ώρα, για το κλειδί της μνήμης
        id: ora
        run: echo "key=$(date -u '+%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Το προηγούμενο public/
        uses: actions/cache@v4
        with:
          path: public
          key: public-${{ steps.ora.outputs.key }}
          restore-keys: public-

      - name: Χτίσιμο
        env:
          # Το ευρετήριο αναζήτησης ξαναχτίζεται το πολύ κάθε 15 λεπτά.
          # Δες το σχόλιο στο publish.js: είναι 100 από τα 114
          # δευτερόλεπτα του χτισίματος, για κάτι που κανείς δεν ψάχνει
          # μέσα στο πρώτο τέταρτο.
          EVRETIRIO_LEPTA: '15'
        run: npm run build

      # Direct upload. Στέλνει ΜΟΝΟ τα αρχεία που δεν έχει ήδη το
      # Cloudflare — τα υπόλοιπα τα αναγνωρίζει από το αποτύπωμά τους.
      #
      # Το --branch=main το κάνει κανονικό deployment της παραγωγής, όχι
      # προεπισκόπηση.
      # Τρεις προσπάθειες, όχι μία.
      #
      # Στις 11 Νοεμβρίου 2026, 1 στα 11 ανεβάσματα έσκασε με «Failed to
      # publish your Function. Got error: Unknown internal error» — δικό
      # τους πρόβλημα, στιγμιαίο. Χωρίς επανάληψη, η ύλη περίμενε το
      # επόμενο τρέξιμο του bot.
      #
      # Το ανέβασμα στέλνει ΟΛΟΚΛΗΡΟ τον φάκελο κάθε φορά, οπότε η
      # επανάληψη δεν αφήνει τίποτα μισοτελειωμένο: ή πέρασε όλο, ή
      # ξαναρχίζει από την αρχή.
      - name: Ανέβασμα στο Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for i in 1 2 3; do
            if npx -y wrangler@4 pages deploy public --project-name=newshub-media --branch=main; then
              exit 0
            fi
            echo "Το ανέβασμα απέτυχε ($i από 3) — ξαναδοκιμάζω σε 15 δευτερόλεπτα." >&2
            sleep 15
          done
          echo 'Και οι τρεις προσπάθειες απέτυχαν.' >&2
          exit 1
